<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=560">
<title>Servex — Connect</title>
<style>
  :root{
    --bg:#0F1115; --surface:#1A1D23; --surface-variant:#232732;
    --on:#E6E9EF; --on-variant:#8A9099;
    --primary:#4C8DFF; --success:#3DDC84; --warning:#FFC93C; --error:#FF5C5C; --offline:#6B7280;
    --border:#2A2E38;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:#06070A; color:var(--on);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; padding:40px;
  }
  .page{width:400px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .cap{font-size:13px;letter-spacing:.06em;color:var(--on-variant);text-transform:uppercase}

  .phone{
    width:360px;height:748px;background:var(--bg);
    border:1px solid var(--border);border-radius:40px;
    padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .screen{
    width:100%;height:100%;background:var(--bg);border-radius:30px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sb{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 6px;font-size:12px;color:var(--on)}
  .sb .right{display:flex;gap:6px;align-items:center;color:var(--on)}
  .sb svg{width:15px;height:15px;display:block}

  .body{flex:1;padding:24px;display:flex;flex-direction:column}
  .logo{
    width:64px;height:64px;border-radius:18px;background:rgba(76,141,255,.14);
    display:flex;align-items:center;justify-content:center;margin:18px auto 18px;color:var(--primary);
  }
  .logo svg{width:32px;height:32px}
  h1{font-size:21px;font-weight:700;text-align:center;margin:0 0 6px}
  .sub{font-size:13px;color:var(--on-variant);text-align:center;margin:0 0 26px;line-height:1.5}

  .field{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:12px}
  .field.focus{border-color:var(--primary)}
  .fl{font-size:11px;color:var(--on-variant)}
  .fv{font-size:14px;margin-top:3px}
  .ph{color:var(--on-variant)}
  .dots{letter-spacing:2px}

  .btn{
    width:100%;padding:13px;border-radius:10px;border:0;background:var(--primary);
    color:#07101F;font-size:15px;font-weight:700;margin-top:6px;
  }
  .progress{display:flex;align-items:center;gap:9px;justify-content:center;margin-top:14px;font-size:13px;color:var(--primary)}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(76,141,255,.25);border-top-color:var(--primary)}

  .slabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-variant);margin:28px 0 8px}
  .srow{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;
  }
  .sname{font-size:14px;font-weight:600;flex:1}
  .chev{color:var(--on-variant);font-size:18px;line-height:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600}
  .pill svg{width:15px;height:15px}
  .p-offline{color:var(--offline);background:rgba(107,114,128,.18)}

  .add{margin-top:auto;text-align:center;font-size:14px;font-weight:600;color:var(--primary);padding:14px 0 4px}
  .gesture{width:120px;height:4px;border-radius:2px;background:#2f3541;margin:0 auto 12px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ic-disk" viewBox="0 0 24 24"><path d="M4 5h16v5H4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 14h16v5H4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 7.5v0.01M8 16.5v0.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-offline" viewBox="0 0 24 24"><path d="M7 18h9a4 4 0 0 0 0.6 -7.95A5 5 0 0 0 8 9.2A4 4 0 0 0 7 18Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-sig" viewBox="0 0 24 24"><path d="M4 18h2M9 14h2M14 10h2M19 6h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-wifi" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6.5 12.5a9 9 0 0 1 11 0M12 18v0.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="ic-batt" viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 11v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="page" id="page">
  <div class="cap">Connect — before a server is linked</div>
  <div class="phone">
    <div class="screen">
      <div class="sb">
        <span>9:41</span>
        <span class="right">
          <svg><use href="#ic-sig"/></svg>
          <svg><use href="#ic-wifi"/></svg>
          <svg><use href="#ic-batt"/></svg>
        </span>
      </div>
      <div class="body">
        <div class="logo"><svg><use href="#ic-disk"/></svg></div>
        <h1>Connect to a server</h1>
        <p class="sub">Enter the agent address and token to start monitoring.</p>

        <div class="field focus"><div class="fl">Server address</div><div class="fv ph">https://web-01.lan:8765</div></div>
        <div class="field"><div class="fl">Token</div><div class="fv dots">••••••••••••</div></div>

        <button class="btn">Connect</button>
        <div class="progress"><span class="spin"></span>Connecting…</div>

        <div class="slabel">Saved servers</div>
        <div class="srow">
          <span class="sname">web-01</span>
          <span class="pill p-offline"><svg><use href="#ic-offline"/></svg>Offline</span>
          <span class="chev">›</span>
        </div>
        <div class="srow">
          <span class="sname">db-01</span>
          <span class="pill p-offline"><svg><use href="#ic-offline"/></svg>Offline</span>
          <span class="chev">›</span>
        </div>

        <div class="add">+ Add a new server</div>
      </div>
      <div class="gesture"></div>
    </div>
  </div>
</div>
</body>
</html>
